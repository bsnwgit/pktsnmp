# pktSNMP configuration
# Copy to <install_dir>/config.yaml, or set PKTSNMP_CONFIG=/path/to/config.yaml,
# then restart the service.
#
# install.sh generates config.yaml from this file automatically, fills in
# secret_key + credential_key, and appends install_dir — edit config.yaml
# afterwards for any further changes.
#
# install_dir is the app root. Every on-disk path below (db_path, duckdb_path,
# log_file, ssl_dir) defaults to somewhere under install_dir and does NOT
# need to be set explicitly — only uncomment one if you need that particular
# path to live somewhere else.
#
# Most runtime settings (storage backend, retention, SNMP settings,
# notifications, etc.) are managed via the Settings page in the UI and
# stored in SQLite. This file only covers infrastructure/startup settings.

# ── Server ────────────────────────────────────────────────────────────────────
host: "0.0.0.0"
port: 8767
workers: 2
debug: false

# ── App root — install.sh appends this automatically ──────────────────────────
# install_dir: "/opt/pktsnmp"

# ── SQLite app database (optional override; default: <install_dir>/pktsnmp.db) ─
# db_path: "/opt/pktsnmp/pktsnmp.db"

# ── ClickHouse (optional — only used if storage_backend is switched to "clickhouse") ──
clickhouse_host: "localhost"
clickhouse_port: 9000
clickhouse_database: "pktsnmp"
clickhouse_user: "default"
clickhouse_password: ""

# ── DuckDB (optional override; default: <install_dir>/snmp.duckdb) ────────────
# Only relevant if using the DuckDB backend instead of ClickHouse for SNMP data.
# duckdb_path: "/opt/pktsnmp/snmp.duckdb"

# ── JWT (generate with: openssl rand -hex 32) ─────────────────────────────────
secret_key: "CHANGE_ME_generate_with_openssl_rand_hex_32"

# ── Credential encryption key (generate with the Fernet command below) ───────
# python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
credential_key: "CHANGE_ME_generate_with_fernet_generate_key"

# ── CORS (restrict to your actual origin in production) ──────────────────────
cors_origins:
  - "http://SERVER-IP:8767"

# ── Logging ───────────────────────────────────────────────────────────────────
log_level: "info"
# log_file: "/opt/pktsnmp/logs/pktsnmp.log"   # optional override; default: <install_dir>/logs/pktsnmp.log

# ── SSL certificates (optional override; default: <install_dir>/ssl) ──────────
# ssl_dir: "/opt/pktsnmp/ssl"
