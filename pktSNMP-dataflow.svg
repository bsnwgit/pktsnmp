  <text x="320" y="468" text-anchor="middle" fill="#7c8ea8" font-size="9">alerts · users · settings</text>
  <text x="320" y="484" text-anchor="middle" fill="#7c8ea8" font-size="9">JWT + SAML 2.0 auth</text>
  <text x="320" y="500" text-anchor="middle" fill="#7c8ea8" font-size="9">RBAC roles</text>

  <!-- Alert Engine -->
  <rect x="420" y="412" width="160" height="96" rx="8" fill="#1a0f0f" stroke="#ef4444" stroke-width="1.5"/>
