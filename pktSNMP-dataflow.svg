  <text x="665" y="363" text-anchor="middle" fill="#f59e0b" font-size="8" font-family="'Courier New', monospace">trap event object</text>

  <!-- ═══ ARROWS — Core internal ═══ -->

  <!-- Ingest → Storage -->
  <line x1="220" y1="458" x2="778" y2="458" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <rect x="478" y="445" width="80" height="14" rx="3" fill="rgba(9,14,26,.9)"/>
