    </marker>
    <marker id="arr-y" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#a855f7"/>
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#090e1a"/>
      <stop offset="100%" style="stop-color:#0d1728"/>
    </linearGradient>
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1625"/>
      <stop offset="100%" style="stop-color:#111f38"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="620" fill="url(#bg-grad)" rx="16"/>

  <!-- Title area -->
  <rect x="0" y="0" width="1080" height="60" fill="#0a1220" rx="0"/>
  <rect x="0" y="44" width="1080" height="16" fill="url(#bg-grad)" rx="0"/>

  <!-- Title / logo placeholder -->
  <text x="36" y="36" fill="#00c9a7" font-size="20" font-weight="900" letter-spacing="-0.5">pkt</text>
  <text x="66" y="36" fill="#e2e8f0" font-size="20" font-weight="900" letter-spacing="-0.5">SNMP</text>
  <text x="120" y="36" fill="#7c8ea8" font-size="13" font-weight="400">  ·  End-to-End Data Flow</text>

  <!-- Version tag -->
  <rect x="940" y="18" width="110" height="24" rx="4" fill="rgba(0,201,167,.12)" stroke="rgba(0,201,167,.3)" stroke-width="1"/>
  <text x="995" y="34" text-anchor="middle" fill="#00c9a7" font-size="10" font-weight="700" letter-spacing="1">pktSuite · 2026</text>

  <!-- ═══ LAYER BANDS ═══ -->

  <!-- Layer 1 band -->
  <rect x="24" y="72" width="1032" height="130" rx="10" fill="rgba(255,255,255,.02)" stroke="#1e2e48" stroke-width="1"/>
  <text x="40" y="92" fill="#7c8ea8" font-size="9" font-weight="700" letter-spacing="2">NETWORK LAYER  —  MANAGED DEVICES</text>

  <!-- Layer 2 band -->
  <rect x="24" y="218" width="1032" height="148" rx="10" fill="rgba(59,130,246,.03)" stroke="#1e3060" stroke-width="1"/>
  <text x="40" y="237" fill="#3b82f6" font-size="9" font-weight="700" letter-spacing="2">COLLECTION LAYER</text>

  <!-- Layer 3 band -->
  <rect x="24" y="382" width="1032" height="148" rx="10" fill="rgba(0,201,167,.03)" stroke="#003d30" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="40" y="401" fill="#00c9a7" font-size="9" font-weight="700" letter-spacing="2">pktSNMP CORE  —  FastAPI · uvicorn · :8767</text>

  <!-- Layer 4 band -->
  <rect x="24" y="546" width="1032" height="58" rx="10" fill="rgba(168,85,247,.03)" stroke="#3b0f6e" stroke-width="1"/>
  <text x="40" y="565" fill="#a855f7" font-size="9" font-weight="700" letter-spacing="2">PRESENTATION LAYER  —  React 18 · TypeScript · Tailwind · Vite</text>

