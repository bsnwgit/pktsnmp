  <text x="500" y="468" text-anchor="middle" fill="#7c8ea8" font-size="9">12 rule types</text>
  <text x="500" y="484" text-anchor="middle" fill="#7c8ea8" font-size="9">auto-fire + auto-resolve</text>
  <text x="500" y="500" text-anchor="middle" fill="#7c8ea8" font-size="9">Slack · PD · email · webhook</text>

