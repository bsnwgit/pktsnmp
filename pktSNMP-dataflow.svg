  <!-- Switch -->
  <rect x="60" y="100" width="118" height="52" rx="8" fill="#162032" stroke="#2a3a55" stroke-width="1.5"/>
  <text x="119" y="122" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">🔀 Switch</text>
  <text x="119" y="140" text-anchor="middle" fill="#7c8ea8" font-size="10">L2/L3 · IF-MIB</text>

  <!-- Firewall -->
  <rect x="210" y="100" width="118" height="52" rx="8" fill="#162032" stroke="#2a3a55" stroke-width="1.5"/>
  <text x="269" y="122" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">🔥 Firewall</text>
  <text x="269" y="140" text-anchor="middle" fill="#7c8ea8" font-size="10">Perimeter · traps</text>

  <!-- Router -->
  <rect x="360" y="100" width="118" height="52" rx="8" fill="#162032" stroke="#2a3a55" stroke-width="1.5"/>
  <text x="419" y="122" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">🔁 Router</text>
  <text x="419" y="140" text-anchor="middle" fill="#7c8ea8" font-size="10">L3 · BGP / OSPF</text>

  <!-- Server -->
  <rect x="510" y="100" width="118" height="52" rx="8" fill="#162032" stroke="#2a3a55" stroke-width="1.5"/>
  <text x="569" y="122" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">🖥 Server</text>
  <text x="569" y="140" text-anchor="middle" fill="#7c8ea8" font-size="10">Compute · sysUpTime</text>

  <!-- WAP -->
  <rect x="660" y="100" width="118" height="52" rx="8" fill="#162032" stroke="#2a3a55" stroke-width="1.5"/>
  <text x="719" y="122" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">📡 WAP</text>
  <text x="719" y="140" text-anchor="middle" fill="#7c8ea8" font-size="10">Wireless · clients</text>

  <!-- UPS -->
  <rect x="810" y="100" width="118" height="52" rx="8" fill="#162032" stroke="#2a3a55" stroke-width="1.5"/>
  <text x="869" y="122" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">⚡ UPS</text>
  <text x="869" y="140" text-anchor="middle" fill="#7c8ea8" font-size="10">Power · environmental</text>

