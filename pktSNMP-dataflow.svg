  <text x="818" y="434" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">Storage</text>
  <text x="818" y="452" text-anchor="middle" fill="#7c8ea8" font-size="9">SQLite  pktsnmp.db  (control plane)</text>
  <text x="818" y="468" text-anchor="middle" fill="#7c8ea8" font-size="9">SQLite  snmp_timeseries.db  (default)</text>
  <text x="818" y="484" text-anchor="middle" fill="#7c8ea8" font-size="9">ClickHouse  (high-volume option)</text>
  <text x="818" y="500" text-anchor="middle" fill="#7c8ea8" font-size="9">217k+ rows · switchable in Settings</text>

