  <text x="574" y="298" text-anchor="middle" fill="#7c8ea8" font-size="10">In-process · asyncio</text>
  <text x="574" y="314" text-anchor="middle" fill="#7c8ea8" font-size="9">SNMP GET v1/v2c/v3</text>
  <text x="574" y="330" text-anchor="middle" fill="#7c8ea8" font-size="9">Configurable poll interval</text>

