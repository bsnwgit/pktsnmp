  <!-- otelcol-contrib — Collector A -->
  <rect x="60" y="244" width="180" height="96" rx="10" fill="#0f1625" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="150" y="266" text-anchor="middle" fill="#3b82f6" font-size="9" font-weight="700" letter-spacing="1">OTELCOL-CONTRIB</text>
  <text x="150" y="282" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">Collector A</text>
  <text x="150" y="298" text-anchor="middle" fill="#7c8ea8" font-size="10">10.0.1.11</text>
  <text x="150" y="314" text-anchor="middle" fill="#7c8ea8" font-size="9" font-family="'Courier New', monospace">snmp rcvr → otlphttp</text>
  <text x="150" y="330" text-anchor="middle" fill="#7c8ea8" font-size="9">gzip · ~576 metrics/batch · 30s timeout</text>

  <!-- otelcol-contrib — Collector B -->
  <rect x="272" y="244" width="180" height="96" rx="10" fill="#0f1625" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="362" y="266" text-anchor="middle" fill="#3b82f6" font-size="9" font-weight="700" letter-spacing="1">OTELCOL-CONTRIB</text>
  <text x="362" y="282" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">Collector B</text>
  <text x="362" y="298" text-anchor="middle" fill="#7c8ea8" font-size="10">10.0.2.20</text>
  <text x="362" y="314" text-anchor="middle" fill="#7c8ea8" font-size="9" font-family="'Courier New', monospace">snmp rcvr → otlphttp</text>
  <text x="362" y="330" text-anchor="middle" fill="#7c8ea8" font-size="9">Bearer token auth · per-collector key</text>

