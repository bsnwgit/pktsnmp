  <text x="786" y="314" text-anchor="middle" fill="#7c8ea8" font-size="9">link-down · coldStart · custom OID</text>
  <text x="786" y="330" text-anchor="middle" fill="#7c8ea8" font-size="9">CAP_NET_BIND_SERVICE</text>

