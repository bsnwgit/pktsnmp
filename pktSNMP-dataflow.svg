  <line x1="719" y1="152" x2="760" y2="242" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-y)"/>
  <line x1="869" y1="152" x2="840" y2="242" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-y)"/>

  <!-- SNMP GET labels -->
  <rect x="68" y="183" width="72" height="14" rx="3" fill="rgba(9,14,26,.85)"/>
  <text x="104" y="194" text-anchor="middle" fill="#3b82f6" font-size="8" font-family="'Courier New', monospace">SNMP GET</text>

  <rect x="278" y="183" width="72" height="14" rx="3" fill="rgba(9,14,26,.85)"/>
  <text x="314" y="194" text-anchor="middle" fill="#3b82f6" font-size="8" font-family="'Courier New', monospace">SNMP GET</text>

  <rect x="488" y="183" width="72" height="14" rx="3" fill="rgba(9,14,26,.85)"/>
  <text x="524" y="194" text-anchor="middle" fill="#00c9a7" font-size="8" font-family="'Courier New', monospace">SNMP GET</text>

  <rect x="698" y="183" width="72" height="14" rx="3" fill="rgba(9,14,26,.85)"/>
  <text x="734" y="194" text-anchor="middle" fill="#f59e0b" font-size="8" font-family="'Courier New', monospace">UDP :162</text>

  <!-- ═══ ARROWS — Collection to Core ═══ -->

