  <rect x="484" y="244" width="180" height="96" rx="10" fill="#0f1625" stroke="#00c9a7" stroke-width="1.5"/>
  <text x="574" y="266" text-anchor="middle" fill="#00c9a7" font-size="9" font-weight="700" letter-spacing="1">LOCAL COLLECTOR</text>
