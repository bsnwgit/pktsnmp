  <text x="507" y="536" fill="#ef4444" font-size="8">notifications</text>

  <!-- ═══ LEGEND ═══ -->
  <rect x="860" y="74" width="196" height="130" rx="8" fill="rgba(9,14,26,.85)" stroke="#1e2e48" stroke-width="1"/>
