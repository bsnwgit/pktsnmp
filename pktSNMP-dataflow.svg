  <!-- OTLP label -->
  <rect x="80" y="366" width="115" height="14" rx="3" fill="rgba(9,14,26,.9)"/>
  <text x="137" y="377" text-anchor="middle" fill="#3b82f6" font-size="8" font-family="'Courier New', monospace">OTLP HTTP gzip POST</text>

  <!-- Trap label -->
